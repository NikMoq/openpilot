name: Build and Release mapd

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: amd64
          - goarch: arm64
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'

      - name: Install capnp dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev
          go install capnproto.org/go/capnp/v3/capnpc-go@v3.1.0-alpha.1
          git clone -b v3.1.0-alpha.1 https://github.com/capnproto/go-capnp ../go-capnp

      - name: Generate capnp code
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          make capnp GO_CAPNP_PATH=../go-capnp/std

      - name: Build static binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o build/mapd-linux-${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapd-linux-${{ matrix.suffix }}
          path: build/mapd-linux-${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
